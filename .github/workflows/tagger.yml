name: Tagger

on:
    release:
        types: [created, edited]

permissions: {}

jobs:
    actions-tagger:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Allow tagger to write the tags
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Tag Release
              uses: stevenjdh/action-tagger@534fa1533fe939d77268fb5b89dfb09c41edca35 # v1.1.0
              with:
                  set-latest-tag: true
