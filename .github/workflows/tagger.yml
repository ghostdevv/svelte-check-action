name: Tagger

on:
    release:
        types: [created, edited]

permissions: {}

jobs:
    actions-tagger:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Allow tagger to write the tags
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Tag Release
              uses: stevenjdh/action-tagger@534fa1533fe939d77268fb5b89dfb09c41edca35 # v1.1.0
              with:
                  set-latest-tag: true
