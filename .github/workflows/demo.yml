name: demo

on:
    - pull_request
    - workflow_dispatch

permissions: {}

# Please view the README for a complete example action
# This is setup to run the changes, as well as the specific node version
# we're targeting

jobs:
    demo:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write # Required to be able to comment on PRs
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup PNPM
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Setup Node 20.20.2
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 20.20.2
                  registry-url: https://registry.npmjs.org/
                  cache: pnpm

            - name: Install
              run: pnpm install

            - name: svelte-check
              uses: ./ # in prod: ghostdevv/svelte-check-action
              with:
                  paths: ./test
                  filterChanges: false
